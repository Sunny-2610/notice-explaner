[project]
name = "notice-explainer"
version = "0.1.0"
description = "Yojana Mitra — AI-assisted government/legal notice explainer (PS-06 AI for Bharat)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Real Q&A agent (LangChain ReAct). create_agent only exists in langchain 1.x;
# fake mode (default) never imports these — see api/deps.py lazy import.
qa = ["langchain>=1.0", "langchain-google-genai>=4.0"]
# Keep in sync with [qa] so the test suite exercises the real tool wiring.
dev = ["pytest>=8.0", "httpx>=0.27", "langchain>=1.0", "langchain-google-genai>=4.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
