name: keep-warm

# Free Render sleeps after ~15 min idle -> 50s cold start breaks Twilio 15s
# webhook. Ping /health every 5 min to keep warm (pilot-grade, not SLA).
# Setup: GitHub repo Settings > Secrets > Actions > New secret
#   RENDER_BASE_URL = https://your-api.onrender.com (no trailing slash)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          if [ -z "$RENDER_BASE_URL" ]; then
            echo "RENDER_BASE_URL secret not set - skipping (set it to enable keep-warm)"
            exit 0
          fi
          curl -fsS --max-time 30 "$RENDER_BASE_URL/health" > /dev/null
          echo "warmed $RENDER_BASE_URL/health"
