services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: notice
      POSTGRES_PASSWORD: notice
      POSTGRES_DB: notice
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      USE_FAKE_AI: "${USE_FAKE_AI:-true}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      BHASHINI_API_KEY: "${BHASHINI_API_KEY:-}"
      DATABASE_URL: postgresql://notice:notice@postgres:5432/notice
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
volumes:
  pgdata:
